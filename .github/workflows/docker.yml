name: Build and publish Docker image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --test
      - name: Build container for runtime smoke test
        run: docker build -t trip-app-test .
      - name: Verify writable data volume with read-only container
        run: |
          docker run -d --name trip-smoke --read-only --cap-drop ALL --security-opt no-new-privileges --env COOKIE_SECURE=false -p 8080:8080 -v trip-smoke-data:/app/data -v trip-smoke-runtime:/app/runtime trip-app-test
          node scripts/container-smoke.mjs
      - name: Verify browser can read documents in restricted container
        run: docker exec trip-smoke node scripts/browser-smoke.mjs
      - name: Verify account and trip navigation in browser
        run: docker exec trip-smoke node scripts/ui-state-smoke.mjs
      - name: Clean up test container
        if: always()
        run: docker rm -f trip-smoke || true
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: BUILD_SHA=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
