services:
  trip:
    image: ghcr.io/sauey41/trip-app:latest
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置至少12位访问密码}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - trip-data:/app/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  trip-data:
