services:
  trip:
    image: ghcr.io/sauey41/trip-app:latest
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - trip-data:/app/data
      - trip-runtime:/app/runtime
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  trip-data:
  trip-runtime:
